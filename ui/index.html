<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TextbookLLM UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>TextbookLLM</h1>
      <section>
        <h2>Ingest</h2>
        <form id="ingest-form">
          <input type="file" id="file" name="file" />
          <button type="submit">Upload</button>
        </form>
        <div id="ingest-result" class="muted"></div>
      </section>

      <section>
        <h2>Query</h2>
        <form id="query-form">
          <input type="text" id="q" name="q" placeholder="Ask a question..." />
          <input type="number" id="k" name="k" value="5" min="1" max="20" />
          <button type="submit">Search</button>
        </form>
        <pre id="answer"></pre>
        <div id="retrieved"></div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
