<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TextbookLLM</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <h1>TextbookLLM</h1>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <h2>Ingest</h2>
        <div id="dropzone" class="dropzone">
          <div class="dz-instructions">
            Drop files here or
            <label for="file" class="link">browse</label>
          </div>
          <input type="file" id="file" name="file" hidden />
        </div>
        <div class="row">
          <button id="upload-btn">Upload</button>
          <div id="ingest-status" class="status"></div>
        </div>

        <!-- Uploaded Files List -->
        <div class="uploaded-files-section">
          <h3>Uploaded Files</h3>
          <div id="uploaded-files-list" class="uploaded-files-list">
            <p class="muted">No files uploaded yet</p>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Query</h2>
        <div class="file-filter">
          <label>
            <input type="checkbox" id="filter-files-toggle" />
            Filter by specific files
          </label>
          <div id="file-selector" class="file-selector" style="display: none">
            <p class="muted">
              Select files to query (leave empty for all files):
            </p>
            <div id="file-list" class="file-list">
              <p class="muted">No files uploaded yet</p>
            </div>
          </div>
        </div>
        <form id="query-form" class="row">
          <input
            type="text"
            id="q"
            name="q"
            placeholder="Ask a question about your documents..."
          />
          <div class="input-group">
            <label for="k">Chunks:</label>
            <input
              type="number"
              id="k"
              name="k"
              value="5"
              min="1"
              max="1000"
              title="Number of chunks to retrieve (1-200)"
            />
          </div>
          <button type="submit">Search</button>
        </form>
        <div id="query-status" class="status"></div>
        <div class="answer-card">
          <div class="answer-header">
            <h3>Answer</h3>
            <button id="copy-answer" title="Copy answer">Copy</button>
          </div>
          <pre id="answer"></pre>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span class="muted"></span>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
